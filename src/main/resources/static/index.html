<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 智能笔记</title>
<style>
  /* ============ 基础 ============ */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary: #5b6ef5;
    --primary-dark: #4453d6;
    --primary-light: #eef0fe;
    --text: #1f2333;
    --text-soft: #6b7280;
    --border: #e8eaf0;
    --bg: #f6f7fb;
    --ok: #10b981;
    --danger: #ef4444;
    --radius: 14px;
    --shadow: 0 1px 3px rgba(24, 28, 50, .06), 0 8px 24px rgba(24, 28, 50, .05);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ============ 顶栏 ============ */
  .hero {
    background: linear-gradient(135deg, #5b6ef5 0%, #8b5cf6 100%);
    color: #fff;
    padding: 40px 24px 56px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 20% 20%, rgba(255,255,255,.18), transparent 45%),
                radial-gradient(circle at 80% 0%, rgba(255,255,255,.12), transparent 40%);
  }
  .hero h1 { font-size: 30px; font-weight: 700; letter-spacing: -.5px; position: relative; }
  .hero p { opacity: .88; margin-top: 8px; font-size: 14px; position: relative; }

  /* ============ 布局 ============ */
  .container { max-width: 1080px; margin: -32px auto 60px; padding: 0 24px; position: relative; }

  .card {
    background: #fff;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 20px;
  }

  .section-title {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title .dot {
    width: 4px; height: 16px; border-radius: 2px;
    background: linear-gradient(180deg, #5b6ef5, #8b5cf6);
  }

  /* ============ 表单 ============ */
  input[type=text], textarea {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    background: #fafbfd;
    transition: border-color .18s, background .18s, box-shadow .18s;
  }
  input[type=text]:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(91,110,245,.1);
  }
  textarea { resize: vertical; min-height: 92px; }
  .field { margin-bottom: 12px; }

  /* ============ 按钮 ============ */
  button {
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    border: none;
    border-radius: 9px;
    padding: 10px 18px;
    cursor: pointer;
    transition: transform .12s, background .18s, box-shadow .18s, opacity .18s;
  }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .55; cursor: not-allowed; }

  .btn-primary {
    background: linear-gradient(135deg, #5b6ef5, #7c5cf6);
    color: #fff;
    box-shadow: 0 4px 14px rgba(91,110,245,.3);
  }
  .btn-primary:hover:not(:disabled) { box-shadow: 0 6px 20px rgba(91,110,245,.4); }

  .btn-ghost {
    background: var(--primary-light);
    color: var(--primary-dark);
  }
  .btn-ghost:hover:not(:disabled) { background: #e3e7fd; }

  .btn-plain {
    background: #f3f4f8;
    color: var(--text-soft);
  }
  .btn-plain:hover:not(:disabled) { background: #e9ebf2; }

  .btn-danger {
    background: #fef2f2;
    color: var(--danger);
  }
  .btn-danger:hover:not(:disabled) { background: #fee2e2; }

  .btn-sm { padding: 7px 13px; font-size: 12.5px; border-radius: 8px; }

  /* ============ 工具栏 ============ */
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
  .toolbar input { flex: 1; min-width: 180px; }

  .stat { font-size: 13px; color: var(--text-soft); margin-left: auto; white-space: nowrap; }
  .stat b { color: var(--primary); font-size: 15px; }

  /* ============ 笔记卡片 ============ */
  .note {
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 14px;
    transition: border-color .18s, box-shadow .18s, transform .18s;
    background: #fff;
  }
  .note:hover {
    border-color: #d4d9f0;
    box-shadow: 0 4px 16px rgba(24,28,50,.07);
    transform: translateY(-1px);
  }

  .note-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 10px;
  }
  .note-title { font-size: 16px; font-weight: 700; word-break: break-word; }
  .note-id { font-size: 12px; color: #b0b5c8; font-weight: 500; margin-right: 6px; }

  .note-content {
    color: #4b5163;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .note-summary {
    margin-top: 12px;
    background: linear-gradient(135deg, #f5f3ff, #eef2ff);
    border-left: 3px solid #8b5cf6;
    border-radius: 8px;
    padding: 11px 14px;
    font-size: 13.5px;
    color: #5b21b6;
    display: flex;
    gap: 8px;
  }
  .note-summary .icon { flex-shrink: 0; }

  .note-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed #eef0f6;
  }

  /* ============ 空状态 / 提示 ============ */
  .empty {
    text-align: center;
    padding: 48px 20px;
    color: #a8aec2;
  }
  .empty .emoji { font-size: 40px; display: block; margin-bottom: 12px; }

  .hint { color: var(--text-soft); font-size: 13.5px; }

  /* ============ Toast 提示 ============ */
  #toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: #1f2333;
    color: #fff;
    padding: 12px 22px;
    border-radius: 10px;
    font-size: 14px;
    box-shadow: 0 8px 28px rgba(0,0,0,.22);
    opacity: 0;
    transition: transform .3s cubic-bezier(.2,.9,.3,1.3), opacity .3s;
    z-index: 999;
    pointer-events: none;
    max-width: 90vw;
  }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  #toast.ok { background: linear-gradient(135deg, #10b981, #059669); }
  #toast.err { background: linear-gradient(135deg, #ef4444, #dc2626); }

  /* ============ 弹窗（编辑） ============ */
  .modal-mask {
    position: fixed; inset: 0;
    background: rgba(24, 28, 50, .45);
    backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    opacity: 0; pointer-events: none;
    transition: opacity .2s;
    z-index: 998;
  }
  .modal-mask.show { opacity: 1; pointer-events: auto; }
  .modal {
    background: #fff;
    border-radius: 16px;
    padding: 26px;
    width: 100%;
    max-width: 520px;
    box-shadow: 0 20px 60px rgba(24,28,50,.3);
    transform: scale(.94) translateY(8px);
    transition: transform .24s cubic-bezier(.2,.9,.3,1.2);
  }
  .modal-mask.show .modal { transform: scale(1) translateY(0); }
  .modal h3 { font-size: 17px; margin-bottom: 18px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }

  /* ============ 加载动画 ============ */
  .spinner {
    display: inline-block;
    width: 13px; height: 13px;
    border: 2px solid rgba(255,255,255,.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    vertical-align: -2px;
    margin-right: 6px;
  }
  .spinner.dark { border-color: rgba(91,110,245,.25); border-top-color: var(--primary); }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 640px) {
    .hero h1 { font-size: 24px; }
    .container { padding: 0 16px; }
    .card { padding: 18px; }
    .stat { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>

<div class="hero">
  <h1>🤖 AI 智能笔记</h1>
  <p>写下想法，让 AI 帮你总结和起标题</p>
</div>

<div class="container">

  <!-- 新建笔记 -->
  <div class="card">
    <div class="section-title"><span class="dot"></span>新建笔记</div>
    <div class="field">
      <input type="text" id="noteTitle" placeholder="标题（可留空，之后可以让 AI 生成）">
    </div>
    <div class="field">
      <textarea id="noteContent" placeholder="写点什么吧..."></textarea>
    </div>
    <button class="btn-primary" id="createBtn" onclick="createNote()">创建笔记</button>
  </div>

  <!-- 笔记列表 -->
  <div class="card">
    <div class="section-title"><span class="dot"></span>我的笔记</div>
    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="搜索标题或内容..." oninput="renderNotes()">
      <span class="stat" id="stat"></span>
    </div>
    <div id="noteList"></div>
  </div>

  <!-- 自由文本 AI 总结 -->
  <div class="card">
    <div class="section-title"><span class="dot"></span>AI 总结工具</div>
    <div class="field">
      <textarea id="freeText" placeholder="粘贴任意一段文字，让 AI 用一句话总结"></textarea>
    </div>
    <button class="btn-primary" id="freeBtn" onclick="summarizeText()">AI 总结</button>
    <div id="freeResult" style="margin-top:14px;"></div>
  </div>

</div>

<!-- 编辑弹窗 -->
<div class="modal-mask" id="editMask" onclick="if(event.target===this) closeEdit()">
  <div class="modal">
    <h3>编辑笔记</h3>
    <div class="field">
      <input type="text" id="editTitle" placeholder="标题">
    </div>
    <div class="field">
      <textarea id="editContent" placeholder="内容"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-plain" onclick="closeEdit()">取消</button>
      <button class="btn-primary" id="saveBtn" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ============ 全局状态 ============ */
let notes = [];          // 缓存笔记列表（搜索时不用重新请求）
let editingId = null;    // 当前编辑的笔记 id

/* ============ 工具函数 ============ */

// 转义 HTML，防止用户输入的内容破坏页面（XSS 防护）
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// 顶部 Toast 提示（比 alert 好看，且不打断操作）
let toastTimer = null;
function toast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = type; }, 2200);
}

// 按钮 loading 状态：防止重复点击
function setLoading(btn, loading, text) {
  if (loading) {
    btn.dataset.oldText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>' + text;
  } else {
    btn.disabled = false;
    btn.innerHTML = btn.dataset.oldText || text;
  }
}

/* ============ ① 创建笔记 ============ */
async function createNote() {
  const title = document.getElementById('noteTitle').value.trim();
  const content = document.getElementById('noteContent').value.trim();
  if (!content) { toast('正文不能为空', 'err'); return; }

  const btn = document.getElementById('createBtn');
  setLoading(btn, true, '创建中...');
  try {
    const res = await fetch('/api/notes', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, content })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);

    document.getElementById('noteTitle').value = '';
    document.getElementById('noteContent').value = '';
    toast('创建成功');
    await loadNotes();
  } catch (e) {
    toast('创建失败：' + e.message, 'err');
  } finally {
    setLoading(btn, false, '创建笔记');
  }
}

/* ============ ② 加载 & 渲染列表 ============ */
async function loadNotes() {
  const list = document.getElementById('noteList');
  list.innerHTML = '<p class="hint"><span class="spinner dark"></span>加载中...</p>';
  try {
    const res = await fetch('/api/notes');
    notes = await res.json();
    renderNotes();
  } catch (e) {
    list.innerHTML = '<p class="empty">加载失败，请确认后端已启动</p>';
  }
}

function renderNotes() {
  const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
  const list = document.getElementById('noteList');

  // 按关键词过滤
  const filtered = keyword
    ? notes.filter(n =>
        (n.title || '').toLowerCase().includes(keyword) ||
        (n.content || '').toLowerCase().includes(keyword))
    : notes;

  // 统计信息
  const withSummary = notes.filter(n => n.aiSummary).length;
  document.getElementById('stat').innerHTML =
    `共 <b>${notes.length}</b> 条 · 已总结 <b>${withSummary}</b> 条`;

  if (filtered.length === 0) {
    list.innerHTML = keyword
      ? '<div class="empty"><span class="emoji">🔍</span>没有匹配的笔记</div>'
      : '<div class="empty"><span class="emoji">📝</span>还没有笔记，去上面创建一条吧</div>';
    return;
  }

  list.innerHTML = filtered.map(n => `
    <div class="note">
      <div class="note-head">
        <div class="note-title">
          <span class="note-id">#${n.id}</span>${escapeHtml(n.title || '(无标题)')}
        </div>
      </div>
      <div class="note-content">${escapeHtml(n.content)}</div>
      ${n.aiSummary ? `<div class="note-summary"><span class="icon">✨</span><span>${escapeHtml(n.aiSummary)}</span></div>` : ''}
      <div class="note-actions">
        <button class="btn-ghost btn-sm" onclick="summarizeNote(${n.id}, this)">AI 总结</button>
        <button class="btn-ghost btn-sm" onclick="generateTitle(${n.id}, this)">AI 起标题</button>
        <button class="btn-plain btn-sm" onclick="openEdit(${n.id})">编辑</button>
        <button class="btn-danger btn-sm" onclick="deleteNote(${n.id})">删除</button>
      </div>
    </div>
  `).join('');
}

/* ============ ③ AI 总结某条笔记 ============ */
async function summarizeNote(id, btn) {
  setLoading(btn, true, '总结中');
  try {
    const res = await fetch(`/api/notes/${id}/summarize`, { method: 'POST' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const note = await res.json();
    // 更新本地缓存，避免整页重新请求
    const i = notes.findIndex(n => n.id === id);
    if (i > -1) notes[i] = note;
    renderNotes();
    toast('AI 总结完成');
  } catch (e) {
    toast('总结失败：' + e.message, 'err');
    setLoading(btn, false, 'AI 总结');
  }
}

/* ============ ④ AI 生成标题 ============ */
async function generateTitle(id, btn) {
  setLoading(btn, true, '生成中');
  try {
    const res = await fetch(`/api/notes/${id}/generate-title`, { method: 'POST' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const note = await res.json();
    const i = notes.findIndex(n => n.id === id);
    if (i > -1) notes[i] = note;
    renderNotes();
    toast('标题已生成');
  } catch (e) {
    toast('生成失败：' + e.message, 'err');
    setLoading(btn, false, 'AI 起标题');
  }
}

/* ============ ⑤ 编辑笔记 ============ */
function openEdit(id) {
  const note = notes.find(n => n.id === id);
  if (!note) return;
  editingId = id;
  document.getElementById('editTitle').value = note.title || '';
  document.getElementById('editContent').value = note.content || '';
  document.getElementById('editMask').classList.add('show');
}

function closeEdit() {
  document.getElementById('editMask').classList.remove('show');
  editingId = null;
}

async function saveEdit() {
  const title = document.getElementById('editTitle').value.trim();
  const content = document.getElementById('editContent').value.trim();
  if (!content) { toast('正文不能为空', 'err'); return; }

  const btn = document.getElementById('saveBtn');
  setLoading(btn, true, '保存中');
  try {
    const res = await fetch(`/api/notes/${editingId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, content })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const updated = await res.json();
    const i = notes.findIndex(n => n.id === editingId);
    if (i > -1) notes[i] = updated;
    closeEdit();
    renderNotes();
    toast('保存成功');
  } catch (e) {
    toast('保存失败：' + e.message, 'err');
  } finally {
    setLoading(btn, false, '保存');
  }
}

/* ============ ⑥ 删除笔记 ============ */
async function deleteNote(id) {
  if (!confirm('确定删除这条笔记吗？')) return;
  try {
    const res = await fetch(`/api/notes/${id}`, { method: 'DELETE' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    notes = notes.filter(n => n.id !== id);
    renderNotes();
    toast('已删除');
  } catch (e) {
    toast('删除失败：' + e.message, 'err');
  }
}

/* ============ ⑦ 自由文本 AI 总结 ============ */
async function summarizeText() {
  const text = document.getElementById('freeText').value.trim();
  if (!text) { toast('请先粘贴文字', 'err'); return; }

  const btn = document.getElementById('freeBtn');
  const result = document.getElementById('freeResult');
  setLoading(btn, true, '思考中...');
  result.innerHTML = '<p class="hint"><span class="spinner dark"></span>AI 正在总结，请稍候...</p>';

  try {
    const res = await fetch('/api/ai/summarize', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    const data = await res.json();
    if (data.summary) {
      result.innerHTML = `<div class="note-summary"><span class="icon">✨</span><span>${escapeHtml(data.summary)}</span></div>`;
    } else {
      result.innerHTML = '<p class="hint">AI 没有返回结果，请重试</p>';
    }
  } catch (e) {
    result.innerHTML = '<p class="hint">出错了：' + escapeHtml(e.message) + '</p>';
  } finally {
    setLoading(btn, false, 'AI 总结');
  }
}

/* ============ 启动 ============ */
loadNotes();
</script>
</body>
</html>
